name: CI

# One file for both SDK repos. Each repo is a plain npm package at its root,
# so nothing here names a package: the only difference between the two is the
# size budget, and that keys off the script's presence rather than a name.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`: setup-node refuses to cache when there is no lockfile,
      # and the React repo has none until the core it depends on is published.
      # An install of one or two dev dependencies is not worth the failure.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` when there is a lockfile, `npm install` when there is not —
      # the React repo gains its lockfile with its first install against the
      # published core.
      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The budget is the point of the core package: it loads on other
      # people's pages. Failing the build is the only thing that keeps it
      # honest. The React repo has no such script and skips this.
      - name: Size budget
        if: hashFiles('scripts/check-size.mjs') != ''
        run: npm run size

      # The last line of defence before a publish. If a source file or a
      # dotfile appears in this list, the `files` allowlist has drifted.
      - name: What would be published
        run: npm publish --dry-run
