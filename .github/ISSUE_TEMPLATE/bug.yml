name: Bug report
description: Something in the SDK does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If this is a **security** issue, please close this and email
        security@gingerdocs.com instead — see SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Package version
      description: "`npm ls @gingerdocs/embed`"
      placeholder: "@gingerdocs/embed@0.1.0"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package
      options: ["@gingerdocs/embed", "@gingerdocs/react", "both / not sure"]
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Console errors and the event log help. Please redact any session URL.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: |
        Your mount code is usually enough. **Please remove any real key or session URL** — a session
        URL is a credential.
      render: javascript
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 141, Safari 26 on iOS"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: ["test", "live"]
    validations:
      required: true

  - type: input
    id: request_id
    attributes:
      label: Request ID (optional)
      description: "From `X-Request-Id`, or Settings → Developer → API logs. It lets us find the exact request."
